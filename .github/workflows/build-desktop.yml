name: build-desktop

# 桌面壳打包：Windows（Setup/Portable）+ macOS（dmg，x64/arm64 各自架构 runner 构建——
# sharp/@napi-rs/canvas 原生二进制不能跨架构混用）。
# 推送 v* tag 或手动触发；产物合并到同一 Release。
# macOS 包未做代码签名：首次打开需右键 → 打开，或执行 `xattr -cr /Applications/ImgMark.app`。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release 标签（留空只传 artifact）
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage 服务端（含 Windows 原生依赖）
        run: |
          mkdir -p desktop/server
          cp -r app/server/bin app/server/src app/server/scripts app/server/package.json app/server/package-lock.json desktop/server/
          cp README.md LICENSE desktop/server/
          cd desktop/server && npm ci --omit=dev --no-audit --no-fund
      - name: 安装 Electron 与打包工具
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: electron-builder 打包
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never
      - name: 收集产物
        run: |
          mkdir -p out
          cp desktop/dist/ImgMark-Setup-*.exe out/ 2>/dev/null || true
          cp desktop/dist/ImgMark-Portable-*.exe out/ 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: out/*.exe
          if-no-files-found: error

  build-mac:
    strategy:
      matrix:
        include:
          - { os: macos-14, arch: arm64, label: apple-silicon }
          - { os: macos-13, arch: x64, label: intel }
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage 服务端（${{ matrix.label }} 原生依赖）
        run: |
          mkdir -p desktop/server
          cp -r app/server/bin app/server/src app/server/scripts app/server/package.json app/server/package-lock.json desktop/server/
          cp README.md LICENSE desktop/server/
          cd desktop/server && npm ci --omit=dev --no-audit --no-fund
      - name: 安装 Electron 与打包工具
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: electron-builder 打包（${{ matrix.arch }}）
        working-directory: desktop
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
      - name: 收集产物
        run: |
          mkdir -p out
          cp desktop/dist/ImgMark-mac-${{ matrix.arch }}-*.dmg out/ 2>/dev/null || cp desktop/dist/*.dmg out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: out/*.dmg
          if-no-files-found: error

  release:
    needs: [build-win, build-mac]
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: 汇总产物
        run: ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          overwrite: true
          files: release/*
