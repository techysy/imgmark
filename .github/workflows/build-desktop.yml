name: build-desktop

# 桌面壳打包：Windows（Setup/Portable）+ macOS。
# macOS arm64（Apple Silicon）为主线任务，随 Release 汇总上传；
# macOS x64（Intel）runner 免费池排队极慢，拆为独立任务：构建成功后自行补传 Release，
# 失败/取消不影响主线 Release（Intel 用户可用源码运行）。
# 推送 v* tag 或手动触发（release_tag 留空只传 artifact）。
# macOS 包未做代码签名：首次打开需右键 → 打开，或执行 `xattr -cr /Applications/ImgMark.app`。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release 标签（留空只传 artifact）
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage 服务端（含 Windows 原生依赖）
        run: |
          mkdir -p desktop/server
          cp -r app/server/bin app/server/src app/server/scripts app/server/package.json app/server/package-lock.json desktop/server/
          cp README.md LICENSE desktop/server/
          cd desktop/server && npm ci --omit=dev --no-audit --no-fund
      - name: 安装 Electron 与打包工具
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: electron-builder 打包
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never
      - name: 收集产物
        run: |
          mkdir -p out
          cp desktop/dist/ImgMark-Setup-*.exe out/ 2>/dev/null || true
          cp desktop/dist/ImgMark-Portable-*.exe out/ 2>/dev/null || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: out/*.exe
          if-no-files-found: error

  build-mac-arm64:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage 服务端（Apple Silicon 原生依赖）
        run: |
          mkdir -p desktop/server
          cp -r app/server/bin app/server/src app/server/scripts app/server/package.json app/server/package-lock.json desktop/server/
          cp README.md LICENSE desktop/server/
          cd desktop/server && npm ci --omit=dev --no-audit --no-fund
      - name: 安装 Electron 与打包工具
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: electron-builder 打包（arm64）
        working-directory: desktop
        run: npx electron-builder --mac --arm64 --publish never
      - name: 收集产物
        run: |
          mkdir -p out
          cp desktop/dist/ImgMark-mac-arm64-*.dmg out/ 2>/dev/null || cp desktop/dist/*.dmg out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-arm64
          path: out/*.dmg
          if-no-files-found: error

  release:
    needs: [build-win, build-mac-arm64]
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成 Release 正文
        run: node scripts/release-notes.js "${{ inputs.release_tag || github.ref_name }}" release-notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: 汇总产物
        run: ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          overwrite_files: true
          name: ImgMark ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          files: release/*

  build-mac-x64:
    # Intel Mac：macos-13 已于 2025-12 停用（任务会永远排队），改用最后一个 Intel 镜像
    # macos-15-intel（GitHub 支持到 2027-08）。仍独立运行 + 单独补传，不阻塞主线
    runs-on: macos-15-intel
    continue-on-error: true
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage 服务端（Intel 原生依赖）
        run: |
          mkdir -p desktop/server
          cp -r app/server/bin app/server/src app/server/scripts app/server/package.json app/server/package-lock.json desktop/server/
          cp README.md LICENSE desktop/server/
          cd desktop/server && npm ci --omit=dev --no-audit --no-fund
      - name: 安装 Electron 与打包工具
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: electron-builder 打包（x64）
        working-directory: desktop
        run: npx electron-builder --mac --x64 --publish never
      - name: 收集产物
        run: |
          mkdir -p out
          cp desktop/dist/ImgMark-mac-x64-*.dmg out/ 2>/dev/null || cp desktop/dist/*.dmg out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-x64
          path: out/*.dmg
          if-no-files-found: error
      - name: 补传 Release
        if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          overwrite_files: true
          files: out/*.dmg
