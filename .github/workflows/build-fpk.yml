name: build-fpk

# 推送 v* tag 自动打包并发布 Release（如 v0.2.2）；
# 也可手动触发（release_tag 留空则只上传 artifact）。
# 产物三变体：
#   window     — fnOS 桌面窗口（iframe），全功能（micro_app + api-scope，需 appcenter ≥ 1.34.0）
#   fullscreen — 全屏/新标签页入口，全功能
#   compat     — 兼容旧版 fnOS：不含 micro_app/api-scope（飞牛授权目录标签不可用，
#                用本地路径/上传；管理员仍可在应用设置页配置授权目录）
# 注意：sharp/@napi-rs/canvas 是平台相关二进制，本流水线产出 x86 包；
# ARM 需在 aarch64 环境安装依赖后打包（参考 scripts/build-fpk.sh）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release 标签（留空只传 artifact，如 v0.2.2）
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 校验 manifest 依赖声明
        run: grep -q "install_dep_apps      = nodejs_v24" manifest

      - name: 安装生产依赖（Linux x64 二进制）
        working-directory: app/server
        run: npm ci --omit=dev --no-audit --no-fund

      - name: 下载 fnpack 1.2.1
        run: |
          curl -fsSL https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64 -o fnpack
          chmod +x fnpack

      - name: 打包三变体 fpk
        run: |
          VERSION=$(tr -d ' \n' < VERSION)
          settype() { node -e "
            const fs=require('fs');const p='app/ui/config';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            j['.url']['imgmark.Application'].type=process.argv[1];
            fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          " "$1"; }
          pack() {
            settype "$1"
            rm -f imgmark.fpk
            ./fnpack build -d .
            mv imgmark.fpk "imgmark-${VERSION}-$2.fpk"
            echo "built $2 -> imgmark-${VERSION}-$2.fpk"
          }
          pack iframe window
          pack url fullscreen
          # compat：去掉开放平台声明（micro_app/api-scope），兼容旧版应用中心
          sed -i '/^micro_app/d' manifest
          echo '{ "data-share": { "shares": [] } }' > config/resource
          pack iframe compat
          ls -la *.fpk

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ github.ref_name }}
          path: "*.fpk"
          if-no-files-found: error

      - name: 发布 Release
        if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          overwrite: true
          name: ImgMark ${{ inputs.release_tag || github.ref_name }}
          body: |
            飞牛 fnOS 应用包（fpk），三个变体按需下载其一：

            - **imgmark-*-x86-window.fpk**：桌面窗口入口（推荐，新版 fnOS）。全功能：应用内选择并授权飞牛目录。
            - **imgmark-*-x86-fullscreen.fpk**：全屏/新标签页入口，功能同上。
            - **imgmark-*-x86-compat.fpk**：兼容旧版应用中心（安装报「设置目录权限失败」时用它）。飞牛授权目录标签不可用，请用本地路径/上传模式。

            安装：fpk 放到应用中心扫描目录（如 `/vol1/1000/fnOS App/fpk/imgmark/`）→ 应用中心「手动安装」。
            要求：fnOS ≥ 1.2.0401，应用中心 ≥ 1.34.0（window/fullscreen 变体），依赖应用 nodejs_v24。
          files: "*.fpk"
